[project]
name = "aion2calc"
version = "0.1.0"
description = "Aion 2 crafting cost calculator with auction house OCR"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "rapidocr>=3.9",        # item-name OCR (Apache-2.0)
    "onnxruntime>=1.20",    # runs RapidOCR's models (MIT)
    "numpy>=2.0",           # digit template matching
    "pillow>=11.0",         # screen capture and image crops
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.10",    # builds the shared .exe (aion2calc.spec)
]

[project.scripts]
aion2calc = "aion2calc.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aion2calc.ui" = ["fonts/*.ttf", "fonts/*.txt"]
"aion2calc.ocr" = ["*.npz"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "rapidocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
